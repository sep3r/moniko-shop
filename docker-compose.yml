services:

  postgres:
    image: postgres:16-alpine
    container_name: monikoshop-db

    environment:
      POSTGRES_DB: monikoshop
      POSTGRES_USER: monikoshop
      # CHANGE THIS in production! Use a strong password and prefer secrets.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monikoshop123}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monikoshop"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: monikoshop-backend

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/monikoshop
      SPRING_DATASOURCE_USERNAME: monikoshop
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-monikoshop123}

      # MUST change in production. Generate a long random string (at least 32+ chars).
      JWT_SECRET: ${JWT_SECRET:-YourSuperSecretKeyForJWTTokenGenerationMustBeLongEnough1234567890}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}

      # Optional: override default admin password (created only on first run)
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@Moniko2026!}

      # Optional extra CORS origins (comma-separated)
      # CORS_ALLOWED_ORIGINS: https://yourdomain.com

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NGINX_CONF: nginx.compose.conf
        VITE_API_URL: /api

    container_name: monikoshop-frontend

    ports:
      - "3000:80"

    depends_on:
      - backend

    restart: unless-stopped

volumes:
  postgres_data:
