# فقط برای اجرای محلی/توسعه. مقادیر حساس را در فایل .env (کنار همین فایل) بگذار؛ نمونه: .env.example
services:

  postgres:
    image: postgres:16-alpine
    container_name: monikoshop-db

    environment:
      POSTGRES_DB: monikoshop
      POSTGRES_USER: monikoshop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}

    # فقط از خود ماشین قابل دسترسی است (نه از شبکه)
    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monikoshop"]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: monikoshop-backend

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/monikoshop
      SPRING_DATASOURCE_USERNAME: monikoshop
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}

      # بدون JWT_SECRET یک کلید موقت تصادفی ساخته می‌شود (با هر ری‌استارت همه logout می‌شوند)
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-28800000}

      # ادمین اولیه (فقط وقتی هیچ ادمینی وجود ندارد ساخته می‌شود)
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@monikoshop.ir}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

      CORS_ALLOW_LOCALHOST: "true"

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NGINX_CONF: nginx.compose.conf
        VITE_API_URL: /api

    container_name: monikoshop-frontend

    ports:
      - "3000:80"

    depends_on:
      - backend

    restart: unless-stopped


volumes:
  postgres_data:
