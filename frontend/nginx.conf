# ربات‌های موتور جستجو و پیش‌نمایش لینک (تلگرام، واتس‌اپ، ...) HTML سروری می‌گیرند؛
# کاربران عادی همچنان اپ React را می‌بینند.
map $http_user_agent $is_crawler {
    default 0;
    "~*(googlebot|bingbot|bingpreview|yandex|baiduspider|duckduckbot|applebot|telegrambot|whatsapp|facebookexternalhit|twitterbot|linkedinbot|slackbot|discordbot|embedly)" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https:; connect-src 'self' https://api.moniko.ir; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    server_tokens off;

    # --- سئو: صفحه‌های سروری برای خزنده‌ها (API روی دامنه‌ی جداست) ---
    # اگر دامنه‌ی API فرق دارد، فقط خط set را عوض کنید.
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    set $seo_upstream "https://api.moniko.ir";
    proxy_ssl_server_name on;
    proxy_set_header Host api.moniko.ir;
    proxy_intercept_errors on;
    error_page 500 502 503 504 = @spa;   # اگر API در دسترس نبود، خزنده هم اپ معمولی را می‌گیرد

    location @spa {
        try_files /index.html =404;
    }

    location = /sitemap.xml {
        proxy_pass $seo_upstream/api/sitemap.xml;
    }

    location = / {
        if ($is_crawler) {
            rewrite ^ /api/seo/home break;
            proxy_pass $seo_upstream;
        }
        try_files /index.html =404;
    }

    location ~ ^/products/(\d+)/?$ {
        if ($is_crawler) {
            rewrite ^/products/(\d+)/?$ /api/seo/products/$1 break;
            proxy_pass $seo_upstream;
        }
        try_files $uri /index.html;
    }

    location ~ ^/categories/([^/]+)/?$ {
        if ($is_crawler) {
            rewrite ^/categories/([^/]+)/?$ /api/seo/categories/$1 break;
            proxy_pass $seo_upstream;
        }
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
