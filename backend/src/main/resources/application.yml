server:
  port: ${PORT:8080}
  # پشت پروکسی/لودبالانسر (رانفلر) تا scheme و host واقعی (https) شناسایی شود
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

spring:
  application:
    name: monikoshop-backend

  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 30MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/monikoshop}
    username: ${SPRING_DATASOURCE_USERNAME:monikoshop}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  # مهاجرت‌های دیتابیس: src/main/resources/db/migration (V1, V2, ...).
  # روی دیتابیس موجود (که قبلاً با ddl-auto ساخته شده) یک بار baseline روی نسخه‌ی ۱ زده می‌شود.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "1"
    locations: classpath:db/migration

  jpa:
    hibernate:
      # فعلاً update (ایمن برای سوییچ تدریجی). بعد از چند دیپلوی موفق با Flyway
      # می‌توانید JPA_DDL_AUTO=validate بگذارید تا اختلاف entity و شما خطا بدهد.
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  site-name: ${SITE_NAME:مونا بیوتی}
  site-description: ${SITE_DESCRIPTION:فروشگاه اینترنتی لوازم آرایشی و بهداشتی؛ خرید آنلاین با ضمانت اصالت کالا و ارسال سریع}
  # آدرس عمومی فرانت‌اند و API (برای sitemap، canonical و تصاویر در صفحات سئو)
  site-url: ${SITE_URL:${APP_BASE_URL:https://moniko.ir}}
  api-url: ${API_PUBLIC_URL:https://api.moniko.ir}
  # قیمت‌ها در دیتابیس «تومان» است؛ ISO 4217 فقط IRR (ریال) دارد، پس ×۱۰
  price-to-rial: ${PRICE_TO_RIAL:10}

tracking:
  # مرز «روز» برای آمار بازدید
  zone: ${TRACKING_ZONE:Asia/Tehran}

jwt:
  # JWT_SECRET is required in production (>= 32 random chars). If missing, a random temporary secret is used.
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:28800000}
  # مدت توکن وقتی کاربر «مرا به خاطر بسپار» را می‌زند (پیش‌فرض ۳ روز)
  remember-expiration: ${JWT_REMEMBER_EXPIRATION:259200000}

# ثبت‌نام و تغییر رمز با کد پیامکی (کاوه‌نگار، Verify Lookup)
kavenegar:
  api-key: ${KAVENEGAR_API_KEY:}
  # نام قالب تأییدیه در پنل کاوه‌نگار (متن قالب باید %token داشته باشد)
  template: ${KAVENEGAR_TEMPLATE:}
  # فقط توسعه‌ی محلی: بدون کاوه‌نگار، کد در لاگ چاپ شود. در production حتماً false بماند.
  dev-log-codes: ${KAVENEGAR_DEV_LOG_CODES:false}

otp:
  ttl-seconds: ${OTP_TTL_SECONDS:180}
  resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
  max-attempts: ${OTP_MAX_ATTEMPTS:5}
  max-per-phone-per-hour: ${OTP_MAX_PER_PHONE_PER_HOUR:5}
  max-per-day-global: ${OTP_MAX_PER_DAY_GLOBAL:2000}
  # راز HMAC کدها (حداقل ۱۶ کاراکتر تصادفی)
  hash-secret: ${OTP_HASH_SECRET:}

logging:
  level:
    com.monikoshop: INFO
    org.springframework.security: WARN

