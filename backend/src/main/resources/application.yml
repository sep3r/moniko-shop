server:
  port: 8080

spring:
  application:
    name: monikoshop-backend

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/monikoshop}
    username: ${SPRING_DATASOURCE_USERNAME:monikoshop}
    password: ${SPRING_DATASOURCE_PASSWORD:monikoshop123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    # IMPORTANT: "kafka" only resolves as a hostname when this app runs *inside*
    # the same docker-compose network as the kafka service (see docker-compose.yml,
    # where the backend container gets SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092).
    # If you run the backend yourself (IDE / mvn spring-boot:run) outside Docker,
    # do NOT set that env var - this "localhost:9092" default is correct as long as
    # you still start Kafka via `docker compose up -d kafka` (its port 9092 is
    # published to the host). Getting UnknownHostException: kafka almost always
    # means the app is running outside the compose network while that env var is
    # still set to kafka:9092 - see the "local-no-docker" Spring profile below.
    # bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        # Fail fast instead of retrying/logging stack traces for minutes when the
        # broker is unreachable - registration/login/orders never wait on Kafka.
        max.block.ms: 3000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
        reconnect.backoff.max.ms: 5000
    consumer:
      group-id: monikoshop-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

jwt:
  secret: ${JWT_SECRET:YourSuperSecretKeyForJWTTokenGenerationMustBeLongEnough1234567890}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    com.monikoshop: INFO
    org.springframework.security: WARN

