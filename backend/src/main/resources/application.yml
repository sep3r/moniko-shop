server:
  port: ${PORT:8080}
  # پشت پروکسی/لودبالانسر (رانفلر) تا scheme و host واقعی (https) شناسایی شود
  forward-headers-strategy: framework

spring:
  application:
    name: monikoshop-backend

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/monikoshop}
    username: ${SPRING_DATASOURCE_USERNAME:monikoshop}
    password: ${SPRING_DATASOURCE_PASSWORD:monikoshop123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:YourSuperSecretKeyForJWTTokenGenerationMustBeLongEnough1234567890}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    com.monikoshop: INFO
    org.springframework.security: WARN

