# Activate with SPRING_PROFILES_ACTIVE=local-no-docker (or -Dspring.profiles.active=local-no-docker)
# when running the backend yourself from an IDE / mvn spring-boot:run, OUTSIDE docker-compose,
# while Postgres and Kafka still run in Docker (e.g. `docker compose up -d postgres kafka`).
#
# This profile forces "localhost" hosts regardless of any SPRING_DATASOURCE_URL /
# SPRING_KAFKA_BOOTSTRAP_SERVERS environment variables you may have set (e.g. from a
# leftover .env file or IDE run config copied from docker-compose.yml), which is what
# causes "UnknownHostException: kafka" - that hostname only exists inside the
# docker-compose network, never on your host machine.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/monikoshop
    username: monikoshop
    password: monikoshop123
  kafka:
    bootstrap-servers: localhost:9092
